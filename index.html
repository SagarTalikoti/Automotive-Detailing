<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/obsidian-emblem.png" />
    <link rel="apple-touch-icon" href="/assets/obsidian-emblem.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#F4F1E9" />

    <!-- SEO & Metadata -->
    <title>OBSIDIAN AUTO STUDIO | Exceptional Automotive Detailing & Paint Protection</title>
    <meta name="description" content="Obsidian Auto Studio is an elite automotive detailing house specializing in multi-stage paint correction, self-healing PPF, ceramic quartz coatings, and bespoke interior restoration." />
    <meta name="keywords" content="automotive detailing, ceramic coating, paint protection film, PPF, paint correction, luxury car detailing, obsidian auto studio" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OBSIDIAN AUTO STUDIO | Every Detail. A Higher Standard." />
    <meta property="og:description" content="Exceptional detailing and advanced paint protection, crafted to preserve the beauty of every vehicle." />
    <meta property="og:image" content="/assets/hero-car-bright.jpg" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="OBSIDIAN AUTO STUDIO | Every Detail. A Higher Standard." />
    <meta property="twitter:description" content="Exceptional detailing and advanced paint protection, crafted to preserve the beauty of every vehicle." />
    <meta property="twitter:image" content="/assets/hero-car-bright.jpg" />

    <!-- Theme Initialization Script to Prevent FOUC -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('obsidian_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches) || !theme) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Preload Critical Hero Asset with fetchpriority="high" -->
    <link rel="preload" as="image" href="/assets/optimized/hero-poster-mobile.webp" media="(max-width: 768px)" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/optimized/hero-poster-desktop.webp" media="(min-width: 769px)" type="image/webp" fetchpriority="high" />

    <!-- Google Fonts Preconnect & Stylesheet (Poppins & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script type="application/ld+json">

      },

      "openingHoursSpecification": [

    }
    </script>
  </head>
