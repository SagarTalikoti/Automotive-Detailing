<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Redline Primary Automotive Gradient -->
    <linearGradient id="redlinePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6E6E" />
      <stop offset="45%" stop-color="#FF4646" />
      <stop offset="100%" stop-color="#E02828" />
    </linearGradient>

    <!-- Deep Obsidian / Tertiary Dark Gradient -->
    <linearGradient id="obsidianDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="60%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>

    <!-- Clean White Sheen -->
    <linearGradient id="whiteSheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield Container with Redline Rim -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#obsidianDark)" stroke="#FF4646" stroke-width="2.5" />
  
  <!-- Subtle Internal Border -->
  <rect x="11" y="11" width="98" height="98" rx="23" fill="none" stroke="#E5D7D7" stroke-width="1" stroke-opacity="0.25" />

  <!-- Left Facet Wing -->
  <path d="M 60,20 L 28,42 L 34,76 L 60,100 Z" fill="#1A1A1A" stroke="#FF4646" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Right Facet Wing -->
  <path d="M 60,20 L 92,42 L 86,76 L 60,100 Z" fill="#222222" stroke="#FF4646" stroke-width="1.5" stroke-linejoin="round" />

  <!-- High-Gloss Reflected Center Facet -->
  <path d="M 60,22 L 80,44 L 60,88 L 40,44 Z" fill="url(#obsidianDark)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Dynamic Aerodynamic Redline Crest / Speedform -->
  <path d="M 36,63 Q 60,38 84,63" fill="none" stroke="url(#redlinePrimary)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 43,72 Q 60,53 77,72" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round" />

  <!-- Central Diamond Apex Gleam (Perfection Spark) -->
  <polygon points="60,43 65,51 60,59 55,51" fill="url(#redlinePrimary)" />
  <circle cx="60" cy="51" r="2" fill="#FFFFFF" />

  <!-- Top Glass Sheen -->
  <path d="M 22,26 C 36,16 84,16 98,26" fill="none" stroke="url(#whiteSheen)" stroke-width="2.5" stroke-linecap="round" />
</svg>
